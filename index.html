<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>English Speak App</title>
    <style>
      :root{--bg:#f7f9fc;--card:#fff;--accent:#2563eb;--text:#0f172a}
      html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text)}
      .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
      h1{margin:0;font-size:1.4rem}
      .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:100%;max-width:920px}
      .card{background:var(--card);border-radius:12px;box-shadow:0 6px 18px rgba(12,20,40,.06);padding:20px;display:flex;align-items:center;justify-content:center;min-height:100px;cursor:pointer;user-select:none;transition:transform .12s,box-shadow .12s}
      .card:focus{outline:3px solid rgba(37,99,235,.18)}
      .card:hover{transform:translateY(-4px)}
      .phrase{font-size:1.05rem;text-align:center}
      .controls{display:flex;gap:12px;align-items:center}
      .small-btn{padding:8px 12px;border-radius:8px;border:none;background:var(--accent);color:white;cursor:pointer}
      .muted{font-size:.9rem;color:#475569}
      footer{font-size:.9rem;color:#475569}
      @media (max-width:420px){.card{min-height:84px;padding:14px}}
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>English Speak App</h1>
      <div class="grid" id="grid">
        <div class="card" role="button" tabindex="0" data-text="I need to use the bathroom.">
          <div class="phrase">I need to use the bathroom.</div>
        </div>
        <div class="card" role="button" tabindex="0" data-text="I would like to go back to my room.">
          <div class="phrase">I would like to go back to my room.</div>
        </div>
        <div class="card" role="button" tabindex="0" data-text="I need water.">
          <div class="phrase">I need water.</div>
        </div>
        <div class="card" role="button" tabindex="0" data-text="I need to sit up.">
          <div class="phrase">I need to sit up.</div>
        </div>
        <div class="card" role="button" tabindex="0" data-text="I would like to go to bed.">
          <div class="phrase">I would like to go to bed.</div>
        </div>
      </div>

      <div class="controls" style="margin-top:8px">
        <label class="muted">Rate</label>
        <input id="rate" type="range" min="0.5" max="1.6" step="0.1" value="1">
        <button id="stop" class="small-btn">Stop</button>
      </div>

      <footer aria-hidden="false">Tap a box or press Enter/Space when focused to speak.</footer>
    </main>

    <script>
      const grid = document.getElementById('grid');
      const rateEl = document.getElementById('rate');
      const stopBtn = document.getElementById('stop');

      function speak(text){
        if(!text) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = parseFloat(rateEl.value) || 1;
        // optional: choose a voice similar to en-US if available
        const voices = window.speechSynthesis.getVoices();
        if(voices && voices.length){
          const v = voices.find(v=>/en-US|English/.test(v.lang)) || voices[0];
          if(v) u.voice = v;
        }
        window.speechSynthesis.speak(u);
      }

      // Handle click and keyboard activation
      grid.addEventListener('click', e=>{
        const card = e.target.closest('.card');
        if(!card) return;
        speak(card.dataset.text);
      });

      grid.addEventListener('keydown', e=>{
        if(e.key === 'Enter' || e.key === ' '){
          const card = e.target.closest('.card');
          if(!card) return;
          e.preventDefault();
          speak(card.dataset.text);
        }
      });

      stopBtn.addEventListener('click', ()=>window.speechSynthesis.cancel());

      // Ensure voices are loaded (some browsers load asynchronously)
      if (typeof speechSynthesis !== 'undefined') {
        speechSynthesis.onvoiceschanged = ()=>{};
      }
    </script>
  </body>
</html>
